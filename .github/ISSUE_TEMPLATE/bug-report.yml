name: Bug report
description: Report an XML preview problem
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Extension version, VS Code version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use a minimal non-confidential XML example when necessary.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: Optional output of XML Viewer — Copy Diagnostic Report. File paths and XML content are excluded by that command.
      render: json
